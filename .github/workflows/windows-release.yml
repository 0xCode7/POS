name: Windows release verification

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Numeric release version (defaults to package.json)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Node.js 24.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run source checks
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Chromium workflow
        run: npm run test:e2e

      - name: Build Electron NSIS installer and portable ZIP
        shell: powershell
        run: .\scripts\windows\Build-ElectronRelease.ps1

      - name: Verify release files and SHA-256 checksums
        shell: powershell
        run: |
          $release = Join-Path $PWD 'release\windows'
          $expected = @{}
          foreach ($line in Get-Content (Join-Path $release 'SHA256SUMS.txt')) {
            if ($line -match '^([a-f0-9]{64}) \*(.+)$') {
              $expected[$Matches[2]] = $Matches[1]
            } else {
              throw "Invalid checksum line: $line"
            }
          }
          foreach ($name in @('RestaurantPOS-Portable.zip', 'RestaurantPOS-Setup.exe')) {
            $file = Join-Path $release $name
            if (-not (Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -le 0) {
              throw "Missing or empty release artifact: $file"
            }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected[$name] -ne $actual) { throw "SHA-256 mismatch for $name" }
            Write-Host "$name $actual"
          }

      # These files are checksum-verified but remain experimental until Windows
      # desktop, restore, and physical-printer acceptance has been completed.
      - name: Publish checksum-verified experimental artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RestaurantPOS-Windows-x64-Experimental
          path: |
            release/windows/RestaurantPOS-Portable.zip
            release/windows/RestaurantPOS-Setup.exe
            release/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify Electron package structure
        shell: powershell
        run: |
          .\scripts\windows\Test-ElectronPackage.ps1

      - name: Verify installed Electron shortcuts and data persistence
        shell: powershell
        run: |
          .\scripts\windows\Test-ElectronInstaller.ps1
