name: Publish verified Windows Electron preview

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Checksum-verified Windows artifact ID from the successful release workflow
        required: true
        type: string
      target_commit:
        description: Commit SHA verified by the Windows release workflow
        required: true
        type: string
      tag:
        description: New prerelease tag (must not already exist)
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the selected Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > artifact.zip
          unzip -q artifact.zip -d release

      - name: Verify release contents and SHA-256 checksums
        run: |
          test -s release/RestaurantPOS-Setup.exe
          test -s release/RestaurantPOS-Portable.zip
          test -s release/SHA256SUMS.txt
          (cd release && sha256sum -c SHA256SUMS.txt)

      - name: Publish a new experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" \
            release/RestaurantPOS-Setup.exe \
            release/RestaurantPOS-Portable.zip \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title 'Restaurant POS v0.2.1 — Electron preview' \
            --prerelease \
            --notes $'نسخة تجريبية من تطبيق Windows Electron المحلي لمطعم أفندينا.\n\nتم التحقق من ملفاتها عبر SHA-256 ومن تشغيل التطبيق المعبأ على Windows CI ببيانات معزولة، بما يشمل: تسجيل الدخول، المنيو، الطلب والدفع النقدي، الإيصال، التقارير، النسخ والاستعادة.\n\nليست جاهزة للإنتاج بعد. يلزم اختبارها على سطح مكتب Windows تفاعلي قبل الاعتماد التشغيلي، خصوصًا حوار اختيار مجلد النسخ والطباعة الفعلية على العتاد.'
