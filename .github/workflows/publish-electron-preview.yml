name: Publish verified Electron preview

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Verified Windows Actions artifact ID to publish
        required: true
        default: '12195208425'
      release_tag:
        description: Existing experimental GitHub Release tag
        required: true
        default: v0.2.0-electron-preview

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified experimental assets
    runs-on: ubuntu-24.04
    steps:
      - name: Download the verified Actions artifact
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$ARTIFACT_ID" in
            ''|*[!0-9]*) echo 'artifact_id must be numeric.' >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output artifact.zip
          unzip -tq artifact.zip
          unzip -q artifact.zip -d release

      - name: Verify artifact contents and checksums
        run: |
          cd release
          test -s RestaurantPOS-Setup.exe
          test -s RestaurantPOS-Portable.zip
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload the verified experimental release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            release/RestaurantPOS-Setup.exe \
            release/RestaurantPOS-Portable.zip \
            release/SHA256SUMS.txt \
            --repo "$REPOSITORY"
